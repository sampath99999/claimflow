server:
  port: ${PORT:8183}
  shutdown: graceful

spring:
  application:
    name: audit-service
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27340}
      database: ${MONGODB_DATABASE:claimflow_audit}
      uuid-representation: standard
      auto-index-creation: true
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19340}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.claimflow.common.event.ClaimStatusChangedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.claimflow.common.event
    producer:
      acks: all

claimflow:
  security:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:http://localhost:8180}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
