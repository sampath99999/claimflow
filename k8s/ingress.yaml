apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claimflow
  namespace: claimflow
spec:
  # AKS application routing add-on (managed NGINX).
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts: [claimflow.example.com]
      secretName: claimflow-tls
  rules:
    - host: claimflow.example.com
      http:
        paths:
          # Only the gateway is exposed; the other services are cluster internal.
          - path: /api
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 80 } }
          - path: /auth
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 80 } }
          - path: /.well-known
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 80 } }
