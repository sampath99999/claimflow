# Template only. Create the real secret out of band, for example:
#   kubectl -n claimflow create secret generic claimflow-secrets #     --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=...
#   kubectl -n claimflow create secret generic claimflow-jwt #     --from-file=private.pem --from-file=public.pem
# On AKS the better option is the Key Vault CSI driver with workload identity.
apiVersion: v1
kind: Secret
metadata:
  name: claimflow-secrets
  namespace: claimflow
type: Opaque
stringData:
  DB_USERNAME: REPLACE_ME
  DB_PASSWORD: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: claimflow-jwt
  namespace: claimflow
type: Opaque
stringData:
  private.pem: REPLACE_WITH_PKCS8_PEM
  public.pem: REPLACE_WITH_X509_PEM
