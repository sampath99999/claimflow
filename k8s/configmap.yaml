apiVersion: v1
kind: ConfigMap
metadata:
  name: claimflow-config
  namespace: claimflow
data:
  # Demo logins live in the gateway's "demo" profile. Drop it once login moves to Entra ID.
  SPRING_PROFILES_ACTIVE: demo
  JWT_ISSUER: https://claimflow.example.com
  JWK_SET_URI: http://gateway.claimflow.svc.cluster.local/.well-known/jwks.json
  MEMBER_SERVICE_URL: http://member-service.claimflow.svc.cluster.local
  CLAIMS_SERVICE_URL: http://claims-service.claimflow.svc.cluster.local
  AUDIT_SERVICE_URL: http://audit-service.claimflow.svc.cluster.local
  CORS_ALLOWED_ORIGINS: https://claimflow.example.com,https://admin.claimflow.example.com
  MEMBERS_DB_URL: jdbc:postgresql://claimflow-pg.postgres.database.azure.com:5432/claimflow_members?sslmode=require
  CLAIMS_DB_URL: jdbc:postgresql://claimflow-pg.postgres.database.azure.com:5432/claimflow_claims?sslmode=require
  KAFKA_BOOTSTRAP_SERVERS: kafka-bootstrap.kafka.svc.cluster.local:9092
  MONGODB_HOST: mongo.mongo.svc.cluster.local
  MONGODB_PORT: "27017"
