apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-service
  namespace: claimflow
  labels: { app: claims-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: claims-service }
  template:
    metadata:
      labels: { app: claims-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: claims-service
          image: claimflowacr.azurecr.io/claimflow/claims-service:latest
          ports:
            - containerPort: 8182
          env:
            - name: PORT
              value: "8182"
            - name: DB_URL
              valueFrom:
                configMapKeyRef: { name: claimflow-config, key: CLAIMS_DB_URL }
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: claimflow-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: claimflow-secrets, key: DB_PASSWORD }
          envFrom:
            - configMapRef:
                name: claimflow-config
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8182 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8182 }
            initialDelaySeconds: 40
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: claims-service
  namespace: claimflow
spec:
  selector: { app: claims-service }
  ports:
    - port: 80
      targetPort: 8182
