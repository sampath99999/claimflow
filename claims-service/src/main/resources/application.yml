server:
  port: ${PORT:8182}
  shutdown: graceful

spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54340/claimflow_claims}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19340}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        spring.json.add.type.headers: false

claimflow:
  security:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:http://localhost:8180}
  claims:
    timely-filing-days: 365
    max-claim-amount: 100000.00
    adjuster-approval-limit: 25000.00
    member-service:
      base-url: ${MEMBER_SERVICE_URL:http://localhost:8181}
      connect-timeout: 2s
      read-timeout: 2s

resilience4j:
  retry:
    instances:
      memberService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      memberService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 1500ms
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.claimflow.claims.client.MemberNotFoundException
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
