server:
  port: ${PORT:8180}
  shutdown: graceful

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

claimflow:
  services:
    member: ${MEMBER_SERVICE_URL:http://localhost:8181}
    claims: ${CLAIMS_SERVICE_URL:http://localhost:8182}
    audit: ${AUDIT_SERVICE_URL:http://localhost:8183}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8180}
    ttl: ${JWT_TTL:PT1H}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5191,http://localhost:5192}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

